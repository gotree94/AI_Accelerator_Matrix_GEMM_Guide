<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="390" viewBox="0 0 1220 390">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.t{font: bold 25px sans-serif;fill:#172b4d} .h{font:bold 18px sans-serif;fill:#17324d}
.tx{font:16px sans-serif;fill:#263746} .sm{font:13px sans-serif;fill:#526273}
.b{stroke:#42627e;stroke-width:2;rx:12;ry:12} .arr{stroke:#657b8c;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657b8c"/></marker></defs>
<text x="40" y="45" class="t">정밀도와 양자화: 데이터 표현의 선택</text>
<rect x="60" y="145" width="230" height="110" class="b" fill="#eaf2f8"/>
<text x="175.0" y="179" text-anchor="middle" class="h">FP32</text>
<text x="175.0" y="208" text-anchor="middle" class="sm">32-bit 부동소수점</text><rect x="345" y="145" width="230" height="110" class="b" fill="#e5f3e8"/>
<text x="460.0" y="179" text-anchor="middle" class="h">FP16 / BF16</text>
<text x="460.0" y="208" text-anchor="middle" class="sm">16-bit 부동소수점</text><rect x="630" y="145" width="230" height="110" class="b" fill="#fff0dc"/>
<text x="745.0" y="179" text-anchor="middle" class="h">INT8</text>
<text x="745.0" y="208" text-anchor="middle" class="sm">8-bit 정수</text><rect x="915" y="145" width="230" height="110" class="b" fill="#f5e9f5"/>
<text x="1030.0" y="179" text-anchor="middle" class="h">INT4</text>
<text x="1030.0" y="208" text-anchor="middle" class="sm">4-bit 정수</text><text x="70" y="330" class="tx">비트 수가 줄면 저장 공간과 데이터 이동량을 줄일 수 있지만, 양자화 오차와 누산 정밀도를 함께 검토해야 한다.</text>
</svg>