<rect x="80" y="130" width="430" height="190" class="b" fill="#eaf2f8"/>
<text x="295.0" y="164" text-anchor="middle" class="h">CNN</text>
<text x="295.0" y="193" text-anchor="middle" class="sm">Convolution → im2col → GEMM</text><rect x="650" y="130" width="470" height="190" class="b" fill="#fff0dc"/>
<text x="885.0" y="164" text-anchor="middle" class="h">Transformer</text>
<text x="885.0" y="193" text-anchor="middle" class="sm">QKᵀ → Softmax → V 곱셈</text><text x="120" y="380" class="sm">Feature Map · 이미지 픽셀 주변 영역을 행렬 연산으로 변환</text><text x="690" y="380" class="sm">Attention · 토큰 간 관계를 행렬 연산으로 계산</text>
</svg>