<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="330" viewBox="0 0 1220 330">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.t{font: bold 25px sans-serif;fill:#172b4d} .h{font:bold 18px sans-serif;fill:#17324d}
.tx{font:16px sans-serif;fill:#263746} .sm{font:13px sans-serif;fill:#526273}
.b{stroke:#42627e;stroke-width:2;rx:12;ry:12} .arr{stroke:#657b8c;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657b8c"/></marker></defs>
<text x="40" y="45" class="t">GPU / AI 가속기 메모리 계층 개념</text>
<rect x="90" y="110" width="210" height="80" class="b" fill="#e5f3e8"/>
<text x="195.0" y="144" text-anchor="middle" class="h">Register</text>
<text x="195.0" y="173" text-anchor="middle" class="sm">연산기 가까운 저장</text><rect x="370" y="110" width="210" height="80" class="b" fill="#eaf2f8"/>
<text x="475.0" y="144" text-anchor="middle" class="h">SRAM / Shared</text>
<text x="475.0" y="173" text-anchor="middle" class="sm">온칩 데이터 재사용</text><rect x="650" y="110" width="210" height="80" class="b" fill="#f5f0df"/>
<text x="755.0" y="144" text-anchor="middle" class="h">Cache</text>
<text x="755.0" y="173" text-anchor="middle" class="sm">반복 접근 데이터</text><rect x="930" y="110" width="210" height="80" class="b" fill="#f9e9e3"/>
<text x="1035.0" y="144" text-anchor="middle" class="h">DRAM / HBM</text>
<text x="1035.0" y="173" text-anchor="middle" class="sm">대용량 메모리</text><path d="M300 150 L370 150 M580 150 L650 150 M860 150 L930 150" class="arr"/><text x="100" y="265" class="tx">일반적으로 연산기에 가까울수록 빠르고 용량은 작으며, 멀리 있을수록 용량은 크고 접근 비용이 커진다.</text>
</svg>