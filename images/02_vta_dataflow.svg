<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="420" viewBox="0 0 1220 420">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.t{font: bold 25px sans-serif;fill:#172b4d} .h{font:bold 18px sans-serif;fill:#17324d}
.tx{font:16px sans-serif;fill:#263746} .sm{font:13px sans-serif;fill:#526273}
.b{stroke:#42627e;stroke-width:2;rx:12;ry:12} .arr{stroke:#657b8c;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657b8c"/></marker></defs>
<text x="40" y="45" class="t">VTA 스타일 GEMM 데이터 흐름</text>
<rect x="50" y="130" width="210" height="105" class="b" fill="#eaf2f8"/>
<text x="155.0" y="164" text-anchor="middle" class="h">DRAM</text>
<text x="155.0" y="193" text-anchor="middle" class="sm">입력 X · 가중치 W</text><rect x="350" y="130" width="210" height="105" class="b" fill="#e9f1fb"/>
<text x="455.0" y="164" text-anchor="middle" class="h">DMA LOAD</text>
<text x="455.0" y="193" text-anchor="middle" class="sm">블록 데이터 전송</text><rect x="650" y="130" width="230" height="105" class="b" fill="#e5f1fb"/>
<text x="765.0" y="164" text-anchor="middle" class="h">SRAM 버퍼</text>
<text x="765.0" y="193" text-anchor="middle" class="sm">inp_ · wgt_ · acc_</text><rect x="970" y="130" width="180" height="105" class="b" fill="#fff0dc"/>
<text x="1060.0" y="164" text-anchor="middle" class="h">GEMM</text>
<text x="1060.0" y="193" text-anchor="middle" class="sm">MAC 연산</text><rect x="970" y="290" width="180" height="85" class="b" fill="#e5f3e8"/>
<text x="1060.0" y="324" text-anchor="middle" class="h">STORE</text>
<text x="1060.0" y="353" text-anchor="middle" class="sm">결과 저장</text><path d="M260 180 L350 180 M560 180 L650 180 M880 180 L970 180 M1060 235 L1060 290" class="arr"/><text x="60" y="340" class="sm">acc_는 int32 누산기이며, 중간 합을 유지하면서 K 축의 누산을 완료한다.</text>
</svg>