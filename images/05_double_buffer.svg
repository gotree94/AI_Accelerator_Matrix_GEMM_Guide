<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="430" viewBox="0 0 1150 430">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.t{font: bold 25px sans-serif;fill:#172b4d} .h{font:bold 18px sans-serif;fill:#17324d}
.tx{font:16px sans-serif;fill:#263746} .sm{font:13px sans-serif;fill:#526273}
.b{stroke:#42627e;stroke-width:2;rx:12;ry:12} .arr{stroke:#657b8c;stroke-width:3;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657b8c"/></marker></defs>
<text x="40" y="45" class="t">Double Buffering / Ping-Pong Buffer</text>
<rect x="70" y="120" width="250" height="95" class="b" fill="#fff0dc"/>
<text x="195.0" y="154" text-anchor="middle" class="h">Buffer A</text>
<text x="195.0" y="183" text-anchor="middle" class="sm">현재 타일 계산</text><rect x="70" y="270" width="250" height="95" class="b" fill="#e5f3e8"/>
<text x="195.0" y="304" text-anchor="middle" class="h">Buffer B</text>
<text x="195.0" y="333" text-anchor="middle" class="sm">다음 타일 DMA LOAD</text><rect x="450" y="120" width="250" height="95" class="b" fill="#eaf2f8"/>
<text x="575.0" y="154" text-anchor="middle" class="h">Compute Engine</text>
<text x="575.0" y="183" text-anchor="middle" class="sm">타일 n 계산</text><rect x="450" y="270" width="250" height="95" class="b" fill="#f5f0df"/>
<text x="575.0" y="304" text-anchor="middle" class="h">DMA Engine</text>
<text x="575.0" y="333" text-anchor="middle" class="sm">타일 n+1 전송</text><path d="M320 165 L450 165 M320 315 L450 315" class="arr"/><text x="790" y="180" class="h">목표</text><text x="790" y="215" class="tx">계산과 데이터 전송을 겹쳐</text><text x="790" y="245" class="tx">연산 대기 시간을 줄인다.</text>
</svg>