<text x="145.0" y="164" text-anchor="middle" class="h">Host CPU</text>
<text x="145.0" y="193" text-anchor="middle" class="sm">명령·제어</text><rect x="330" y="130" width="210" height="90" class="b" fill="#f9e9e3"/>
<text x="435.0" y="164" text-anchor="middle" class="h">DRAM / HBM</text>
<text x="435.0" y="193" text-anchor="middle" class="sm">입력·가중치·결과</text><rect x="630" y="130" width="210" height="90" class="b" fill="#eaf2f8"/>
<text x="735.0" y="164" text-anchor="middle" class="h">DMA + SRAM</text>
